# Machine rules: RAM is shared by many agents and a running MiSArch. Keep Gradle lean.
org.gradle.daemon=false
org.gradle.parallel=false
# only configure the projects a build needs (a broken services/<x>/build.gradle.kts does not break other agents' builds)
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g
# JDK 25 toolchain is auto-provisioned (foojay) into ~/.gradle/jdks if no local JDK 25 exists.
org.gradle.java.installations.auto-download=true
