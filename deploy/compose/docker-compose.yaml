    image: daprio/dapr:1.15.14
    command:
    - ./placement
    - -port
    - '50006'
  dapr-redis:
    image: redis
    command: redis-server --requirepass redis
    volumes:
    - redis-data:/var/lib/redis/data
    ports:
    - 6379:6379
  zipkin-all-in-one:
    image: openzipkin/zipkin:latest
    restart: always
    ports:
    - 9411:9411
  otel-collector:
    image: otel/opentelemetry-collector:0.67.0
    restart: always
    command:
    - --config=/etc/otel-collector-config.yaml
    volumes:
    - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
    - zipkin-all-in-one
  media-minio:
    # media's S3-compatible blob store: RustFS (MinIO's community server is no longer distributed). The host name stays
    # `media-minio` because MINIO_ENDPOINT and the frontend's /api/media proxy (Host header of pre-signed URLs) use it.
    # Credentials admin/password are hard-coded in the media service (as in the original).
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
    volumes:
    - media-rustfs-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health/ready
      interval: 60s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 2s
volumes:
  address-db-data: null
  catalog-db-data: null
  discount-db-data: null
  inventory-db-data: null
  invoice-db-data: null
  keycloak-db-data: null
  media-rustfs-data: null
  notification-db-data: null
  order-db-data: null
  payment-db-data: null
  redis-data: null
  return-db-data: null
  review-db-data: null
  shipment-db-data: null
  shoppingcart-db-data: null
  tax-db-data: null
  user-db-data: null
  wishlist-db-data: null
