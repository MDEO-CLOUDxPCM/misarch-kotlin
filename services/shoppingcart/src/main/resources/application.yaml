# Shared defaults (federation, graphql.packages=org.misarch, Flyway locations, Dapr endpoint) come from libs/common
# (MisarchDefaultsEnvironmentPostProcessor). Runtime config via env vars: SPRING_R2DBC_URL, SPRING_FLYWAY_URL,
# SPRING_R2DBC_USERNAME, SPRING_R2DBC_PASSWORD (replace the original MONGODB_URI), OTEL_* (OpenTelemetry agent).
spring:
  application:
    name: shoppingcart
graphql:
  # the Rust original serves GraphQL at `/` (gateway and order call /v1.0/invoke/shoppingcart/method/)
  endpoint: /
  # the original has no /graphiql and no /sdl route (GET / serves GraphiQL, see AsyncGraphqlRoutes (libs/common, org.misarch.common.rust.asyncgraphql))
  graphiql:
    enabled: false
  sdl:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        # GET /health is served by AsyncGraphqlRoutes (libs/common, org.misarch.common.rust.asyncgraphql): always 200 with an empty body like the original
        exclude: "*"
