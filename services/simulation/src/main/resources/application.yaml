# Shared defaults (health at /health) come from libs/common (MisarchDefaultsEnvironmentPostProcessor). Runtime config
# via env vars: RABBITMQ_URL (required), PAYMENT_URL, SHIPMENT_URL, RETRY_COUNT and the experiment-config variables
# (PAYMENTS_PER_MINUTE, ...; see ExperimentConfigService).
spring:
  application:
    name: simulation
  autoconfigure:
    exclude:
      # no GraphQL subgraph, no persistence, no Dapr subscriptions
      - org.misarch.common.MisarchCommonAutoConfiguration
      - com.expediagroup.graphql.server.spring.GraphQLAutoConfiguration
      - io.dapr.springboot.DaprAutoConfiguration
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.DataR2dbcAutoConfiguration
      - org.springframework.boot.data.r2dbc.autoconfigure.DataR2dbcRepositoriesAutoConfiguration
  flyway:
    enabled: false
  jackson:
    deserialization:
      # a missing or null `amount` in a registration is a 400 (the common default would turn it into 0)
      fail-on-null-for-primitives: true

misarch:
  simulation:
    rabbitmq:
      url: ${RABBITMQ_URL:}
    connector:
      payment-url: ${PAYMENT_URL:NOT_SET}
      shipment-url: ${SHIPMENT_URL:NOT_SET}
      retry-count: ${RETRY_COUNT:3}
    # rate-limit reset at second 0 of every minute ("-" disables it, for tests)
    reset-cron: "0 * * * * *"
