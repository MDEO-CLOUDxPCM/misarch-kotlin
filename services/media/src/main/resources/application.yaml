# The media service has no database: the bucket `media-data` of the S3-compatible store (MinIO, RustFS) is its only
# store (docs/specs/media.md). Env vars: MINIO_ENDPOINT (required), PATH_EXPIRATION_TIME (seconds, default 86400),
# PROXY_PATH (default /api/media).
spring:
  application:
    name: media
  autoconfigure:
    exclude:
      - org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration
  flyway:
    enabled: false
# GraphQL is served at `/` (gateway: localhost:3500/v1.0/invoke/media/method/)
graphql:
  endpoint: /
misarch:
  graphql:
    # uploadMedia(mediaFile: Upload!) is a GraphQL multipart request
    multipart-upload: true
    # the SDL declares `scalar UUID` without a description
    scalar-descriptions: false
media:
  minio-endpoint: ${MINIO_ENDPOINT}
  path-expiration-time: ${PATH_EXPIRATION_TIME:86400}
  proxy-path: ${PROXY_PATH:/api/media}
