# Shared defaults (health at /health, federation, graphql.packages=org.misarch, Flyway locations, Dapr endpoint)
# come from libs/common (MisarchDefaultsEnvironmentPostProcessor). Runtime config via env vars:
# SPRING_R2DBC_URL, SPRING_FLYWAY_URL, SPRING_R2DBC_USERNAME, SPRING_R2DBC_PASSWORD.
spring:
  application:
    name: invoice
# GraphQL is served at `/` (gateway: localhost:3500/v1.0/invoke/invoice/method/)
graphql:
  endpoint: /
